[package]
name = "better-tracker"
version = "0.9.4"
description = "Better Tracker"
authors = ["better-tracker"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[lib]
name = "better_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-android-fs = "30.2"
tauri-plugin-barcode-scanner = "2"
# GitHub no envía cabeceras CORS en los assets de release; el plugin HTTP usa
# el cliente nativo de Android y respeta el scope de `capabilities/mobile.json`.
tauri-plugin-http = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
