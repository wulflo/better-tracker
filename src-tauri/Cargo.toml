[package]
name = "better-tracker"
version = "0.8.5"
description = "Better Tracker"
authors = ["better-tracker"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[lib]
name = "better_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
# Sincronización P2P
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rustls-pki-types = "1"
rcgen = "0.14"
sha2 = "0.10"
qrcode = "0.14"
base64 = "0.22"
tokio = { version = "1", features = ["net", "time", "macros", "rt-multi-thread", "sync", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
rand = "0.8"
if-addrs = "0.13"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
minisign-verify = "0.3"
semver = "1"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
