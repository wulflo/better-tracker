name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install deps
        run: npm ci
      - name: Verify version sync
        run: |
          node scripts/sync-version.mjs
          git diff --exit-code -- package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
      - name: Verify app icons are up to date
        run: |
          npm run icons
          # `icon.icns` cambia en cada generación (el CLI no es determinista ahí),
          # así que solo se comparan los iconos reproducibles.
          git diff --exit-code -- src-tauri/icons ':(exclude)src-tauri/icons/icon.icns'
      - name: Type check
        run: npx tsc --noEmit
      - name: Frontend tests
        run: npm test
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: cargo-deny
        run: |
          cargo install cargo-deny --locked
          cargo deny --manifest-path src-tauri/Cargo.toml check
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --file src-tauri/Cargo.lock
