name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install deps
        run: npm ci --ignore-scripts || npm install --ignore-scripts
      - name: Sync version
        run: node scripts/sync-version.mjs
      - name: Type check
        run: npx tsc --noEmit
      - name: Frontend tests
        run: npm test
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: cargo-deny
        run: |
          cargo install cargo-deny --locked || true
          cargo deny --manifest-path src-tauri/Cargo.toml check || true
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked || true
          cargo audit --manifest-path src-tauri/Cargo.toml || true
      - name: No Android remnants
        run: |
          if grep -ri "android" --include="*.rs" --include="*.ts" --include="*.tsx" --include="*.json" --include="*.toml" . | grep -v node_modules | grep -vi "docs" ; then echo "Android remnants found"; exit 1; fi
          echo "OK"