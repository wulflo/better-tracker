name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install deps
        run: npm ci
      - name: Verify version sync
        run: |
          node scripts/sync-version.mjs
          git diff --exit-code -- package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
      - name: Type check
        run: npx tsc --noEmit
      - name: Frontend tests
        run: npm test
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: cargo-deny
        run: |
          cargo install cargo-deny --locked || true
          cargo deny --manifest-path src-tauri/Cargo.toml check || true
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked || true
          cargo audit --manifest-path src-tauri/Cargo.toml || true
      - name: No Android remnants
        run: |
          if grep -ri "android" \
            --include="*.rs" --include="*.ts" --include="*.tsx" --include="*.json" --include="*.toml" \
            --exclude="package-lock.json" \
            --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=target --exclude-dir=gen --exclude-dir=docs . ; then
            echo "Android remnants found"
            exit 1
          fi
          echo "OK"