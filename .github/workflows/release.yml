name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  version:
    needs: checks
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify version files
        run: |
          node scripts/sync-version.mjs
          if ! git diff --quiet -- package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock; then
            echo "::error::Version files are out of sync. Run 'node scripts/sync-version.mjs' and commit the result."
            git diff -- package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
            exit 1
          fi
      - name: Read VERSION
        id: ver
        run: |
          VER=$(tr -d '[:space:]' < VERSION)
          if ! [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must be strict SemVer X.Y.Z, got '$VER'"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"

  draft:
    needs: version
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          VER="${{ needs.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; reusing it."
          else
            gh release create "$TAG" --draft --title "$TAG" --notes "Release $VER"
          fi

  build:
    needs: [version, draft]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install Linux deps
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm libfuse2 xvfb
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install deps
        run: npm ci
      - name: Sync version
        run: node scripts/sync-version.mjs
      - name: Configure Windows signing (optional)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            Write-Host "No Windows certificate configured; building unsigned."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "certificate.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pwd = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pwd
          $ts = if ($env:WINDOWS_TIMESTAMP_URL) { $env:WINDOWS_TIMESTAMP_URL } else { "http://timestamp.digicert.com" }
          $json = Get-Content "src-tauri/tauri.windows.conf.json" -Raw | ConvertFrom-Json
          $json.bundle.windows | Add-Member -NotePropertyName certificateThumbprint -NotePropertyValue $cert.Thumbprint -Force
          $json.bundle.windows | Add-Member -NotePropertyName digestAlgorithm -NotePropertyValue "sha256" -Force
          $json.bundle.windows | Add-Member -NotePropertyName timestampUrl -NotePropertyValue $ts -Force
          $json | ConvertTo-Json -Depth 20 | Set-Content "src-tauri/tauri.windows.conf.json"
          "WINDOWS_CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          Remove-Item $pfx
          Write-Host "Windows certificate imported: $($cert.Thumbprint)"
      - name: Build (Linux)
        if: matrix.platform == 'linux'
        run: npm run tauri build
      - name: Build (Windows)
        if: matrix.platform == 'windows'
        run: npm run tauri build
      - name: Verify Linux artifacts
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          for f in src-tauri/target/release/bundle/deb/*.deb; do dpkg-deb -I "$f" >/dev/null; done
          for f in src-tauri/target/release/bundle/rpm/*.rpm; do rpm -qpi "$f" >/dev/null; done
          IMG=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -n1)
          chmod +x "$IMG"
          mkdir -p appimage_extracted
          ABS=$(realpath "$IMG")
          (cd appimage_extracted && "$ABS" --appimage-extract >/dev/null)
          test -n "$(find appimage_extracted/squashfs-root -name '*.desktop' -print -quit)"
          UPD=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -n1)
          test -f "$UPD"
          test -f "$UPD.sig"
          base64 -d "$UPD.sig" | grep -q '^untrusted comment:'
      - name: Verify Windows artifacts
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $base = "src-tauri/target/release/bundle"
          $exe = Get-ChildItem "$base/nsis" -Filter *.exe -ErrorAction SilentlyContinue
          $msi = Get-ChildItem "$base/msi" -Filter *.msi -ErrorAction SilentlyContinue
          $exeSig = Get-ChildItem "$base/nsis" -Filter *.exe.sig -ErrorAction SilentlyContinue
          $msiSig = Get-ChildItem "$base/msi" -Filter *.msi.sig -ErrorAction SilentlyContinue
          if (-not $exe) { throw "NSIS installer missing" }
          if (-not $msi) { throw "MSI installer missing" }
          if (-not $exeSig) { throw "NSIS updater signature missing" }
          if (-not $msiSig) { throw "MSI updater signature missing" }
          if ((Get-Item $exeSig.FullName).Length -lt 100) { throw "NSIS updater signature looks empty" }
          if ((Get-Item $msiSig.FullName).Length -lt 100) { throw "MSI updater signature looks empty" }
          if ($env:WINDOWS_CERT_THUMBPRINT) {
            foreach ($f in @($exe + $msi)) {
              $sig = Get-AuthenticodeSignature $f.FullName
              if ($sig.Status -ne "Valid") { throw "Invalid signature on $($f.Name): $($sig.Status)" }
            }
          } else {
            Write-Host "Unsigned build: skipping Authenticode verification."
          }
      - name: Upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.version.outputs.tag }}"
          shopt -s nullglob
          files=()
          if [ "${{ matrix.platform }}" = "linux" ]; then
            files+=(src-tauri/target/release/bundle/deb/*.deb)
            files+=(src-tauri/target/release/bundle/deb/*.deb.sig)
            files+=(src-tauri/target/release/bundle/rpm/*.rpm)
            files+=(src-tauri/target/release/bundle/rpm/*.rpm.sig)
            files+=(src-tauri/target/release/bundle/appimage/*.AppImage)
            files+=(src-tauri/target/release/bundle/appimage/*.AppImage.sig)
          else
            files+=(src-tauri/target/release/bundle/nsis/*.exe)
            files+=(src-tauri/target/release/bundle/nsis/*.exe.sig)
            files+=(src-tauri/target/release/bundle/msi/*.msi)
            files+=(src-tauri/target/release/bundle/msi/*.msi.sig)
          fi
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No release assets found for ${{ matrix.platform }}"
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

  build-android:
    needs: [version, draft]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK components
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true
          NDK_DIR=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | head -n1)
          if [ -z "$NDK_DIR" ]; then
            sdkmanager "ndk;27.0.12077973" || true
            NDK_DIR=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | head -n1)
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Install deps
        run: npm ci
      - name: Sync version
        run: node scripts/sync-version.mjs
      - name: Initialize Android project
        run: npm run tauri android init -- --ci
      - name: Patch Android manifest (camera)
        run: |
          python3 - <<'PY'
          p='src-tauri/gen/android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          if 'android.permission.CAMERA' not in s:
              s=s.replace('<uses-permission android:name="android.permission.INTERNET" />',
                          '<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />',1)
              open(p,'w').write(s)
          print('patched')
          PY
      - name: Patch Android signing config
        run: |
          python3 - <<'PY'
          p='src-tauri/gen/android/app/build.gradle.kts'
          s=open(p).read()
          if 'ANDROID_KEYSTORE_PATH' not in s:
              s=s.replace('    buildTypes {\n        getByName("debug") {',
                          '    val keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")\n    if (keystorePath != null) {\n        signingConfigs {\n            create("release") {\n                storeFile = file(keystorePath)\n                storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")\n                keyAlias = System.getenv("ANDROID_KEY_ALIAS")\n                keyPassword = System.getenv("ANDROID_KEY_PASSWORD")\n            }\n        }\n    }\n    buildTypes {\n        getByName("debug") {',1)
              s=s.replace('        getByName("release") {\n            optimization {',
                          '        getByName("release") {\n            if (keystorePath != null) {\n                signingConfig = signingConfigs.getByName("release")\n            }\n            optimization {',1)
              open(p,'w').write(s)
          print('patched')
          PY
      - name: Configure Android signing (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > src-tauri/gen/android/app/release.keystore
            echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/src-tauri/gen/android/app/release.keystore" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> $GITHUB_ENV
            echo "Android signing configured."
          else
            echo "No Android keystore configured; building unsigned."
          fi
      - name: Build Android APK
        run: npm run tauri android build -- --apk --ci
      - name: Upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.version.outputs.tag }}"
          shopt -s nullglob globstar
          files=(src-tauri/gen/android/app/build/outputs/apk/**/*.apk)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No APK artifacts found"
            find src-tauri/gen/android -name "*.apk" || true
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber


  publish:
    needs: [version, build, build-android]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          rm -rf assets
          mkdir -p assets
          gh release download "$TAG" --dir assets
          rm -f assets/latest.json assets/release-manifest.json assets/SHA256SUMS.txt
      - name: Generate updater manifest
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          VER="${{ needs.version.outputs.version }}"
          node scripts/generate-updater-manifest.mjs assets latest.json "$TAG" "$VER" "${{ github.repository }}" --require-all
      - name: Generate release manifest
        run: |
          node scripts/generate-release-manifest.mjs assets release-manifest.json
          node scripts/validate-manifest.mjs release-manifest.json
      - name: Upload manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          gh release upload "$TAG" latest.json release-manifest.json --clobber
      - name: Generate SHA256SUMS
        run: |
          rm -rf publish_assets
          mkdir -p publish_assets
          cp -a assets/. publish_assets/
          cp latest.json release-manifest.json publish_assets/
          (cd publish_assets && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum | sed 's#  \./#  #') > SHA256SUMS.txt
          node scripts/check-sha256sums.mjs release-manifest.json SHA256SUMS.txt
      - name: Upload SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          gh release upload "$TAG" SHA256SUMS.txt --clobber
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          VER="${{ needs.version.outputs.version }}"
          NOTES="docs/releases/$TAG.md"
          if [ ! -f "$NOTES" ]; then
            NOTES=$(mktemp)
            printf 'Release %s\n' "$VER" > "$NOTES"
          fi
          gh release edit "$TAG" --draft=false --title "$TAG" --notes-file "$NOTES" --latest
          gh release view "$TAG" --json tagName,isDraft,assets
