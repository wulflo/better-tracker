name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  version:
    needs: checks
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute version
        id: ver
        run: |
          BASE=$(cat VERSION | tr -d '[:space:]')
          MAJOR_MINOR=$(echo "$BASE" | cut -d. -f1,2)
          PATCH=$(git rev-list --count HEAD)
          VER="${MAJOR_MINOR}.${PATCH}"
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "tag=v$VER" >> $GITHUB_OUTPUT
      - name: Inject version (build only)
        run: |
          node -e "
            const fs=require('fs');
            const v=process.argv[1];
            // tauri.conf.json
            let t=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8'));
            t.version=v; fs.writeFileSync('src-tauri/tauri.conf.json',JSON.stringify(t,null,2));
            // package.json
            let p=JSON.parse(fs.readFileSync('package.json','utf8'));
            p.version=v; fs.writeFileSync('package.json',JSON.stringify(p,null,2));
            // Cargo.toml
            let c=fs.readFileSync('src-tauri/Cargo.toml','utf8');
            c=c.replace(/^version\\s*=\\s*\"[^\"]*\"/m,'version = \"'+v+'\"');
            fs.writeFileSync('src-tauri/Cargo.toml',c);
          " "${{ steps.ver.outputs.version }}"

  draft:
    needs: version
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          VER="${{ needs.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release exists, reusing"
          else
            gh release create "$TAG" --draft --title "$TAG" --notes "Release $VER"
          fi

  build:
    needs: [version, draft]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: macos-14
            platform: macos
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install Linux deps
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm libfuse2 xvfb
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install deps
        run: npm ci --ignore-scripts || npm install --ignore-scripts
      - name: Inject version
        run: |
          node -e "
            const fs=require('fs');
            const v=process.argv[1];
            let t=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8')); t.version=v; fs.writeFileSync('src-tauri/tauri.conf.json',JSON.stringify(t,null,2));
            let p=JSON.parse(fs.readFileSync('package.json','utf8')); p.version=v; fs.writeFileSync('package.json',JSON.stringify(p,null,2));
            let c=fs.readFileSync('src-tauri/Cargo.toml','utf8'); c=c.replace(/^version\\s*=\\s*\"[^\"]*\"/m,'version = \"'+v+'\"'); fs.writeFileSync('src-tauri/Cargo.toml',c);
          " "${{ needs.version.outputs.version }}"
      - name: Build (Linux)
        if: matrix.platform == 'linux'
        run: npm run tauri build
      - name: Build (macOS universal)
        if: matrix.platform == 'macos'
        run: |
          npm run tauri build -- --target universal-apple-darwin
      - name: Verify Linux artifacts
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          for f in src-tauri/target/release/bundle/deb/*.deb; do dpkg-deb -I "$f" >/dev/null; done
          for f in src-tauri/target/release/bundle/rpm/*.rpm; do rpm -qpi "$f" >/dev/null; done
          IMG=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -n1)
          chmod +x "$IMG"
          mkdir -p appimage_extracted
          ABS=$(realpath "$IMG")
          (cd appimage_extracted && "$ABS" --appimage-extract)
          test -n "$(find appimage_extracted/squashfs-root -name '*.desktop' -print -quit)"
      - name: Upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          if [ "${{ matrix.platform }}" = "linux" ]; then
            for f in src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/rpm/*.rpm src-tauri/target/release/bundle/appimage/*.AppImage; do
              gh release upload "$TAG" "$f" --clobber
            done
          else
            for f in src-tauri/target/release/bundle/dmg/*.dmg; do
              gh release upload "$TAG" "$f" --clobber
            done
          fi

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.build.outputs.tag || '' }}"
          # fallback: get tag from version job not available; use latest draft tag
          TAG=$(gh release list --json tagName,isDraft -q '.[] | select(.isDraft==true) | .tagName' | head -n1)
          mkdir -p assets
          gh release download "$TAG" --dir assets
          cd assets && find . -type f -print0 | sort -z | xargs -0 sha256sum > ../SHA256SUMS.txt && cd ..
          gh release upload "$TAG" SHA256SUMS.txt --clobber
          gh release edit "$TAG" --draft=false